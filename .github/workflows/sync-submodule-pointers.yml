name: Sync Submodule Pointers

# 各子仓库每天 03:00-03:30 先合并上游，这里在之后把父仓钉住的提交跟到各仓库分支尖端。
# 只读远端分支尖端再更新索引，不克隆子模块，几秒即可完成。
# 指针没变化时不提交，仓库保持干净。

on:
  schedule:
    - cron: '0 21 * * *' # 05:00 Asia/Shanghai，晚于各仓库同步与 04:30 的看门狗巡检
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-submodule-pointers
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Bump pointers to branch tips
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          while read -r key path; do
            name="${key#submodule.}"
            name="${name%.path}"
            url=$(git config -f .gitmodules --get "submodule.${name}.url")
            branch=$(git config -f .gitmodules --get "submodule.${name}.branch" || true)
            branch="${branch:-main}"
            tip=$(git ls-remote "${url}" "refs/heads/${branch}" | awk 'NR==1{print $1}')
            if [ -z "${tip}" ]; then
              echo "${path}: 取不到 ${branch} 分支尖端，跳过"
              continue
            fi
            current=$(git rev-parse "HEAD:${path}")
            if [ "${tip}" = "${current}" ]; then
              echo "${path}: 已是最新 ${tip:0:9}"
              continue
            fi
            git update-index --cacheinfo "160000,${tip},${path}"
            echo "${path}: ${current:0:9} -> ${tip:0:9}（${branch}）"
            changed=1
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.changed == '1'
        run: |
          set -euo pipefail
          git commit -m "chore(submodules): 指针跟到各仓库分支最新"
          git push
