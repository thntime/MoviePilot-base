name: Sync Forks

# 每天巡检 8 个 fork 的上游同步是否正常，发现异常就在本仓库开 issue：
#   1. 任一仓库的「Sync Upstream」最近 48 小时没有任何运行记录
#      （GitHub 停用 fork 的工作流、定时任务被停用、工作流被删都会表现成「静默」，不巡检没人会发现）；
#   2. 6 个纯镜像 fork 的默认分支落后于上游（同步失败、冲突未处理或长期没跑）。
#
# 同步动作本身由各仓库内的 .github/workflows/sync-upstream.yml 完成：GitHub 的 GITHUB_TOKEN 只能写自己所在的
# 仓库，从本仓库跨仓库快进需要自备令牌，所以这里只做巡检与告警。
# MoviePilot 与 MoviePilot-Frontend 带自有提交：只巡检，它们的同步是合并式的，
# 任何情况下都不要对这两个仓库做快进或强制同步。
on:
  schedule:
    - cron: '30 20 * * *' # 04:30 Asia/Shanghai，晚于各仓库的 03:00 同步
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-forks
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PROMPT_DISABLED: '1'
      FORK_OWNER: thntime
      UPSTREAM_OWNER: jxxghp
      ISSUE_TITLE: fork 同步异常
      # 带自有提交的两个仓库：只检查同步是否还在运行。
      DEV_REPOS: MoviePilot MoviePilot-Frontend
      # 纯镜像仓库：除运行检查外，还要求不落后于上游。
      MIRROR_REPOS: >-
        MoviePilot-Wiki MoviePilot-Server MoviePilot-Maintenance
        MoviePilot-Site-Collector MoviePilot-Plugins MoviePilot-Resources
      SILENT_HOURS: 48
    steps:
      - name: Audit fork sync
        id: audit
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/fork-sync-report.md"
          : > "${report}"
          now=$(date -u +%s)

          for repo in ${DEV_REPOS} ${MIRROR_REPOS}; do
            last=$(gh api "repos/${FORK_OWNER}/${repo}/actions/workflows/sync-upstream.yml/runs?per_page=1" \
              --jq '.workflow_runs[0] | "\(.created_at) \(.event) \(.conclusion)"')
            if [ -z "${last}" ]; then
              printf -- '- `%s`：「Sync Upstream」没有任何运行记录，Actions 可能被 GitHub 停用，或工作流未启用。\n' \
                "${repo}" >> "${report}"
              echo "${repo}: 没有运行记录"
              continue
            fi
            created=$(printf '%s' "${last}" | awk '{print $1}')
            age=$(( (now - $(date -u -d "${created}" +%s)) / 3600 ))
            echo "${repo}: 最近一次同步 ${last}（${age} 小时前）"
            if [ "${age}" -gt "${SILENT_HOURS}" ]; then
              printf -- '- `%s`：「Sync Upstream」最近一次运行是 %s（%s 小时前，%s），已超过 %s 小时；到 %s/%s/actions 查看是否被停用。\n' \
                "${repo}" "${created}" "${age}" "${last#* }" "${SILENT_HOURS}" "${FORK_OWNER}" "${repo}" >> "${report}"
            fi
          done

          for repo in ${MIRROR_REPOS}; do
            status=$(gh api "repos/${FORK_OWNER}/${repo}/compare/${UPSTREAM_OWNER}:main...${FORK_OWNER}:main" \
              --jq '"\(.status) behind=\(.behind_by) ahead=\(.ahead_by)"')
            echo "${repo}: ${status}"
            behind=$(printf '%s' "${status}" | sed -n 's/.*behind=\([0-9]*\).*/\1/p')
            if [ "${behind}" != "0" ]; then
              printf -- '- `%s` 没有跟上上游：%s；到 %s/%s/actions 查看「Sync Upstream」是否失败。\n' \
                "${repo}" "${status}" "${FORK_OWNER}" "${repo}" >> "${report}"
            fi
          done

          # 只做信息展示：带自有提交的仓库落后上游多少是常态，下次合并后才会归零。
          for repo in ${DEV_REPOS}; do
            echo "${repo} 相对上游: $(gh api \
              "repos/${FORK_OWNER}/${repo}/compare/${UPSTREAM_OWNER}:v3...${FORK_OWNER}:v3" \
              --jq '"\(.status) behind=\(.behind_by) ahead=\(.ahead_by)"')"
          done

          if [ -s "${report}" ]; then
            echo "unhealthy=true" >> "$GITHUB_OUTPUT"
            cat "${report}"
          else
            echo "unhealthy=false" >> "$GITHUB_OUTPUT"
            echo "8 个仓库的同步均在运行，6 个纯镜像 fork 均已跟上上游"
          fi

      - name: Open or update issue
        if: steps.audit.outputs.unhealthy == 'true'
        env:
          REPORT_FILE: ${{ runner.temp }}/fork-sync-report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          detail=$(cat "${REPORT_FILE}")
          body=$(printf 'fork 同步巡检发现以下异常：\n\n%s\n\n- 巡检记录：%s\n\n处理：到对应仓库的 Actions 页查看「Sync Upstream」；\n被 GitHub 停用时点「I understand my workflows, go ahead and re-enable them」；\n有冲突时在该仓库手工合并上游后重新运行。\n' \
            "${detail}" "${RUN_URL}")
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq "[.[] | select(.title == \"${ISSUE_TITLE}\") | .number][0] // empty")
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${existing}" -f body="${body}" > /dev/null
            echo "已更新 issue #${existing}"
          else
            number=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" -f title="${ISSUE_TITLE}" -f body="${body}" --jq '.number')
            echo "已创建 issue #${number}"
          fi
          exit 1
